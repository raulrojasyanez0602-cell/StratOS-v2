name: stratOS motor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# ESTO ES LO QUE SOLUCIONA EL ERROR DE PERMISOS (403)
permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stratOS engine
        env:
          CAPITAL_INICIAL: "650.0"
          COMISION_PCT: "0.0018"
          NOCIONAL_PCT: "0.30"
        run: python main.py

      - name: Guardar y subir trades al repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trades.json || echo "No hay archivo trades.json"
          git commit -m "🤖 Actualización automática de trades [skip ci]" || echo "No hay cambios nuevos"
          git push